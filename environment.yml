name: ef5-builder
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.24,<2.4  # pysheds uses np.in1d, removed in NumPy 2.4.
  - scipy>=1.10
  - scikit-learn=1.5.2  # Match the version used to train the bundled KW models.
  - pyproj>=3.4
  - rasterio>=1.3
  - libgdal-grib
  - geopandas>=0.14
  - pysheds>=0.4,<0.6
  - matplotlib
  - requests>=2.31
  - jupyterlab
  - ipykernel
  - pytest
  - setuptools>=68
  - wheel
  - pip
  - pip:
      - .
