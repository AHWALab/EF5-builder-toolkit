[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ef5-builder-toolkit"
version = "2.0.0"
description = "Tools for preparing EF5 model layers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2.4", "pyproj>=3.4", "scipy>=1.10", "rasterio>=1.3", "geopandas>=0.14"]

[project.optional-dependencies]
kw = ["scikit-learn==1.5.2"]
dem = ["pysheds>=0.4,<0.6"]
notebook = ["jupyterlab", "matplotlib", "requests>=2.31"]
test = ["pytest", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["ef5_builder*"]

[tool.setuptools.package-data]
ef5_builder = ["models/kw/*.p"]
